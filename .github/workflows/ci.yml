name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

      - name: Unit tests
        run: pnpm -r test

      - name: Verification benchmark (recall / false positives)
        run: pnpm --filter @bpc-oss/dsh-verification bench

      - name: dist-pack consistency (repack vs committed tgz)
        run: node scripts/check-dist-pack.mjs
